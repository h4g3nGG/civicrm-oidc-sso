name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          # A Gitea job token is not a GitHub API token. Passing it to
          # setup-php can stall or fail GitHub API probes.
          github-token: ''
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

