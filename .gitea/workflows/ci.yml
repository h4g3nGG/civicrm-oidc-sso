name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Prefer reachable IPv4 package mirrors
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          # A Gitea job token is not a GitHub API token. Passing it to
          # setup-php can stall or fail GitHub API probes.
          github-token: ''
      - run: composer validate --strict
      - run: php scripts/validate-manifest.php
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prefer reachable IPv4 package mirrors
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          github-token: ''
      - name: Build release archive
        run: sh scripts/build-release.sh /tmp/civicrm-oidc-sso.tar.gz
      - name: Verify release archive
        run: sh scripts/validate-release-archive.sh /tmp/civicrm-oidc-sso.tar.gz

  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prefer reachable IPv4 package mirrors
        run: echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          github-token: ''
      - name: Run isolated OIDC browser flow
        run: sh tests/Integration/run.sh

