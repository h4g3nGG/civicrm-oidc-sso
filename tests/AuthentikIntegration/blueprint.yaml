version: 1
metadata:
  name: CiviCRM OIDC E2E
entries:
  - model: authentik_core.group
    id: civicrm-e2e-staff
    identifiers:
      name: e2e.staff

  - model: authentik_core.user
    identifiers:
      username: e2e.staff
    attrs:
      name: E2E Staff User
      email: staff@example.test
      is_active: true
      groups:
        - !KeyOf civicrm-e2e-staff
      password: !Env AUTHENTIK_E2E_USER_PASSWORD

  - model: authentik_providers_oauth2.scopemapping
    id: civicrm-e2e-groups
    identifiers:
      name: CiviCRM E2E group claim
    attrs:
      scope_name: groups
      description: Synthetic group claim for the isolated CiviCRM test
      expression: |
        return {"groups": [group.name for group in request.user.all_groups()]}

  - model: authentik_providers_oauth2.oauth2provider
    id: civicrm-e2e-provider
    identifiers:
      name: CiviCRM E2E
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: civicrm-e2e
      client_secret: !Env AUTHENTIK_E2E_CLIENT_SECRET
      redirect_uris:
        - url: https://civicrm/civicrm/oidc/callback
          matching_mode: strict
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf civicrm-e2e-groups

  - model: authentik_core.application
    identifiers:
      slug: civicrm-e2e
    attrs:
      name: CiviCRM E2E
      provider: !KeyOf civicrm-e2e-provider
      policy_engine_mode: any
