name: Feature request
description: Propose a provider-neutral improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the general use case without organization-specific data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: standards
    attributes:
      label: Relevant standards or documented APIs
      description: Link applicable OIDC and CiviCRM documentation if known.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not require a CiviCRM core or identity-provider patch.
          required: true
