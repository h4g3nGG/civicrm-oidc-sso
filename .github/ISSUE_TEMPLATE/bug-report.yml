name: Bug report
description: Report a reproducible defect without sensitive data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities, tokens, credentials, personal data or
        internal hostnames here. Follow SECURITY.md for private reporting.
  - type: input
    id: version
    attributes:
      label: Extension version or commit
      placeholder: 0.3.0-beta.4 or full commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: CiviCRM, PHP and OpenID Provider versions
      placeholder: CiviCRM 6.19.5, PHP 8.3, provider and version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction steps
      description: Redact tokens, claims, email addresses and deployment details.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed credentials, tokens, personal data and internal hostnames.
          required: true
