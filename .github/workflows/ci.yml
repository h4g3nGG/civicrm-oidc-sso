name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: php scripts/validate-manifest.php
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Build release archive
        run: sh scripts/build-release.sh /tmp/civicrm-oidc-sso.tar.gz
      - name: Verify reproducible release archive
        run: |
          sh scripts/build-release.sh /tmp/civicrm-oidc-sso-second.tar.gz
          cmp /tmp/civicrm-oidc-sso.tar.gz /tmp/civicrm-oidc-sso-second.tar.gz
      - name: Verify release archive
        run: sh scripts/validate-release-archive.sh /tmp/civicrm-oidc-sso.tar.gz

  full-stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Run isolated OIDC browser flow
        run: sh tests/Integration/run.sh
      - name: Retain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: full-stack-diagnostics
          path: |
            .e2e-runtime/compose.log
            .e2e-runtime/browser-results/
          if-no-files-found: ignore
          retention-days: 7

  authentik-full-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Run isolated Authentik OIDC browser flow
        run: sh tests/AuthentikIntegration/run.sh
