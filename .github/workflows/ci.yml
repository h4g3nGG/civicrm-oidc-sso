name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: php scripts/validate-manifest.php
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Build release archive
        run: sh scripts/build-release.sh /tmp/civicrm-oidc-sso.tar.gz
      - name: Verify release permissions and entrypoint
        run: |
          mode=$(tar -tvzf /tmp/civicrm-oidc-sso.tar.gz oidc_sso/ | awk 'NR == 1 {print $1}')
          test "$mode" = "drwxr-xr-x"
          tar -tzf /tmp/civicrm-oidc-sso.tar.gz | grep -qx 'oidc_sso/oidc_sso.php'
