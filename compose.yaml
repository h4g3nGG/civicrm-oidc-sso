services:
  test:
    image: composer:2.8
    working_dir: /workspace
    volumes:
      - .:/workspace
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    command: ["sh", "-lc", "composer install --no-interaction --prefer-dist && composer check"]

volumes:
  composer-cache:

